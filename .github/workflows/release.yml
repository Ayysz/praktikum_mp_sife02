name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag release (contoh: v1.0.11)'
        required: false
        default: 'v1.0.11'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${{ inputs.tag_name || 'v1.0.11' }}"
          fi
          BUILD_NAME="${TAG_NAME#v}"
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Rename APK
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${{ inputs.tag_name || 'v1.0.11' }}"
          fi
          mv build/app/outputs/flutter-apk/app-release.apk "praktikum_mp_04sife02_ammar-${TAG_NAME}.apk"
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: praktikum_mp_04sife02_ammar-*.apk
          generate_release_notes: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: praktikum_mp_04sife02_ammar-apk
          path: praktikum_mp_04sife02_ammar-*.apk
          retention-days: 7
